<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2a2a2a">
<link rel="manifest" href="manifest.webmanifest">
<title>MERCATURA v0.1 - Foundation</title>
<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #222;
  color: #fff;
  font-family: system-ui, -apple-system, sans-serif;
}

#canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  background: rgba(0, 0, 0, 0.6);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12px;
  pointer-events: none;
  z-index: 100;
}

#controls {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

#joystick {
  position: fixed;
  bottom: 20px;
  left: 20px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.3);
  pointer-events: auto;
  z-index: 50;
  touch-action: none;
}

#joystick::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  pointer-events: none;
}

#look-zone {
  position: fixed;
  right: 0;
  top: 0;
  width: 40%;
  height: 100%;
  pointer-events: auto;
  touch-action: none;
  z-index: 40;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">
  <div>MERCATURA v0.1 - Foundation</div>
  <div style="font-size: 10px; opacity: 0.7; margin-top: 4px;">Left: Move | Right: Look</div>
</div>
<div id="controls">
  <div id="joystick"></div>
  <div id="look-zone"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
// ============================================================================
// MERCATURA v0.1 - Foundation Build with Three.js
// ============================================================================

// ============================================================================
// SCENE SETUP
// ============================================================================

const canvas = document.getElementById('canvas');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x666688);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.set(6, 1.7, 14);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = false;

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================================
// LIGHTING
// ============================================================================

const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
directionalLight.position.set(6, 3, 6);
scene.add(directionalLight);

// ============================================================================
// MATERIALS
// ============================================================================

const wallMaterial = new THREE.MeshPhongMaterial({ color: 0xaaaaaa });
const floorMaterial = new THREE.MeshPhongMaterial({ color: 0x8b6f47 });
const ceilingMaterial = new THREE.MeshPhongMaterial({ color: 0x999999 });
const checkoutMaterial = new THREE.MeshPhongMaterial({ color: 0xcc8844 });
const shelfMaterial = new THREE.MeshPhongMaterial({ color: 0xa87a52 });
const deskMaterial = new THREE.MeshPhongMaterial({ color: 0x555555 });
const monitorMaterial = new THREE.MeshPhongMaterial({ color: 0x1a1a1a });

// ============================================================================
// WORLD GEOMETRY - Room Dimensions: 12m x 16m x 3.2m high
// ============================================================================

// Floor
const floorGeometry = new THREE.PlaneGeometry(12, 16);
const floor = new THREE.Mesh(floorGeometry, floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
scene.add(floor);

// Ceiling
const ceilingGeometry = new THREE.PlaneGeometry(12, 16);
const ceiling = new THREE.Mesh(ceilingGeometry, ceilingMaterial);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = 3.2;
scene.add(ceiling);

// Left Wall (x = 0)
const leftWallGeometry = new THREE.BoxGeometry(0.2, 3.2, 16);
const leftWall = new THREE.Mesh(leftWallGeometry, wallMaterial);
leftWall.position.set(-0.1, 1.6, 8);
scene.add(leftWall);

// Right Wall (x = 12)
const rightWallGeometry = new THREE.BoxGeometry(0.2, 3.2, 16);
const rightWall = new THREE.Mesh(rightWallGeometry, wallMaterial);
rightWall.position.set(12.1, 1.6, 8);
scene.add(rightWall);

// Back Wall (z = 16)
const backWallGeometry = new THREE.BoxGeometry(12, 3.2, 0.2);
const backWall = new THREE.Mesh(backWallGeometry, wallMaterial);
backWall.position.set(6, 1.6, 16.1);
scene.add(backWall);

// Front Wall - Left Section (z = 0, x = 0 to 5)
const frontWallLeftGeometry = new THREE.BoxGeometry(5, 3.2, 0.2);
const frontWallLeft = new THREE.Mesh(frontWallLeftGeometry, wallMaterial);
frontWallLeft.position.set(2.5, 1.6, -0.1);
scene.add(frontWallLeft);

// Front Wall - Right Section (z = 0, x = 7 to 12)
const frontWallRightGeometry = new THREE.BoxGeometry(5, 3.2, 0.2);
const frontWallRight = new THREE.Mesh(frontWallRightGeometry, wallMaterial);
frontWallRight.position.set(9.5, 1.6, -0.1);
scene.add(frontWallRight);

// Front Wall - Door Lintel (top of entrance, x = 5 to 7, z = 2.1 to 3.2)
const lintelGeometry = new THREE.BoxGeometry(2, 1.1, 0.2);
const lintel = new THREE.Mesh(lintelGeometry, wallMaterial);
lintel.position.set(6, 2.65, -0.1);
scene.add(lintel);

// ============================================================================
// FIXTURES
// ============================================================================

// Checkout Counter (base + front face + top counter surface)
// Position: x ~2.5, z ~2 (left-center area, easy to reach from entrance)

// Counter base (box)
const counterBaseGeometry = new THREE.BoxGeometry(1.5, 0.8, 0.8);
const counterBase = new THREE.Mesh(counterBaseGeometry, checkoutMaterial);
counterBase.position.set(2.5, 0.4, 2);
scene.add(counterBase);

// Counter front panel (raised)
const counterFrontGeometry = new THREE.BoxGeometry(1.5, 0.4, 0.1);
const counterFront = new THREE.Mesh(counterFrontGeometry, checkoutMaterial);
counterFront.position.set(2.5, 0.95, 1.85);
scene.add(counterFront);

// Counter top surface (conveyor-like)
const counterTopGeometry = new THREE.BoxGeometry(1.6, 0.08, 0.9);
const counterTop = new THREE.Mesh(counterTopGeometry, new THREE.MeshPhongMaterial({ color: 0xddaa55 }));
counterTop.position.set(2.5, 1.1, 2);
scene.add(counterTop);

// ============================================================================
// SUPERMARKET SHELF
// Position: x ~9, z ~8 (right-center area)

// Shelf left post
const postLeftGeometry = new THREE.BoxGeometry(0.15, 1.8, 0.15);
const postLeft = new THREE.Mesh(postLeftGeometry, shelfMaterial);
postLeft.position.set(8.6, 0.9, 8);
scene.add(postLeft);

// Shelf right post
const postRight = new THREE.Mesh(postLeftGeometry, shelfMaterial);
postRight.position.set(9.4, 0.9, 8);
scene.add(postRight);

// Shelf boards (3 levels)
const boardGeometry = new THREE.BoxGeometry(0.9, 0.08, 0.6);
const shelfLevel1 = new THREE.Mesh(boardGeometry, shelfMaterial);
shelfLevel1.position.set(9, 0.5, 8);
scene.add(shelfLevel1);

const shelfLevel2 = new THREE.Mesh(boardGeometry, shelfMaterial);
shelfLevel2.position.set(9, 1.0, 8);
scene.add(shelfLevel2);

const shelfLevel3 = new THREE.Mesh(boardGeometry, shelfMaterial);
shelfLevel3.position.set(9, 1.5, 8);
scene.add(shelfLevel3);

// ============================================================================
// ORDERING TERMINAL (Desk + Monitor/Tablet)
// Position: x ~6, z ~3 (center area, near entrance)

// Desk surface
const deskGeometry = new THREE.BoxGeometry(0.8, 0.75, 0.6);
const desk = new THREE.Mesh(deskGeometry, deskMaterial);
desk.position.set(6, 0.375, 3);
scene.add(desk);

// Monitor/tablet on desk
const monitorGeometry = new THREE.BoxGeometry(0.5, 0.4, 0.05);
const monitor = new THREE.Mesh(monitorGeometry, monitorMaterial);
monitor.position.set(6, 1.05, 2.95);
scene.add(monitor);

// ============================================================================
// COLLISION SYSTEM - AABB with Player Radius
// ============================================================================

// Fixture collision bounds: {x, y, z, w, h, d, name}
const fixtures = [
  // Walls
  { x: 0, y: 1.6, z: 8, w: 0.2, h: 3.2, d: 16, name: 'left-wall' },
  { x: 12, y: 1.6, z: 8, w: 0.2, h: 3.2, d: 16, name: 'right-wall' },
  { x: 6, y: 1.6, z: 16, w: 12, h: 3.2, d: 0.2, name: 'back-wall' },
  { x: 2.5, y: 1.6, z: 0, w: 5, h: 3.2, d: 0.2, name: 'front-wall-left' },
  { x: 9.5, y: 1.6, z: 0, w: 5, h: 3.2, d: 0.2, name: 'front-wall-right' },
  { x: 6, y: 2.65, z: 0, w: 2, h: 1.1, d: 0.2, name: 'lintel' },
  
  // Checkout counter
  { x: 2.5, y: 0.55, z: 2, w: 1.5, h: 1.1, d: 0.9, name: 'checkout' },
  
  // Shelf
  { x: 9, y: 0.9, z: 8, w: 0.9, h: 1.8, d: 0.6, name: 'shelf' },
  
  // Desk
  { x: 6, y: 0.375, z: 3, w: 0.8, h: 0.75, d: 0.6, name: 'desk' },
];

const PLAYER_RADIUS = 0.3;

function canMoveTo(x, y, z) {
  // Check collision against all fixtures
  for (let fixture of fixtures) {
    const dx = Math.abs(x - fixture.x);
    const dz = Math.abs(z - fixture.z);
    
    // AABB collision in XZ plane (ignore Y for walking)
    if (dx < fixture.w / 2 + PLAYER_RADIUS && dz < fixture.d / 2 + PLAYER_RADIUS) {
      return false;
    }
  }
  
  return true;
}

// ============================================================================
// PLAYER CONTROLLER
// ============================================================================

let player = {
  x: 6,
  y: 1.7,
  z: 14,
  angle: 0,
  vx: 0,
  vz: 0,
};

const MOVE_SPEED = 5; // m/s
const LOOK_SPEED = 0.005;

// ============================================================================
// MOBILE CONTROLS
// ============================================================================

let joystickActive = false;
let joystickX = 0;
let joystickY = 0;

const joystickElement = document.getElementById('joystick');
const lookZone = document.getElementById('look-zone');

joystickElement.addEventListener('pointerdown', e => {
  e.preventDefault();
  joystickActive = true;
  joystickElement.setPointerCapture?.(e.pointerId);
  updateJoystick(e);
});

joystickElement.addEventListener('pointermove', e => {
  if (joystickActive) {
    updateJoystick(e);
  }
});

joystickElement.addEventListener('pointerup', e => {
  joystickActive = false;
  joystickX = 0;
  joystickY = 0;
});

function updateJoystick(e) {
  const rect = joystickElement.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const dx = e.clientX - cx;
  const dy = e.clientY - cy;
  const dist = Math.hypot(dx, dy);
  const maxDist = 50;
  
  if (dist > maxDist) {
    joystickX = (dx / dist);
    joystickY = (dy / dist);
  } else {
    joystickX = dx / maxDist;
    joystickY = dy / maxDist;
  }
}

// Look (right side swipe)
let lookStartX = null;

lookZone.addEventListener('pointerdown', e => {
  e.preventDefault();
  lookStartX = e.clientX;
  lookZone.setPointerCapture?.(e.pointerId);
});

lookZone.addEventListener('pointermove', e => {
  if (lookStartX !== null) {
    const deltaX = (e.clientX - lookStartX) * LOOK_SPEED;
    player.angle += deltaX;
    lookStartX = e.clientX;
  }
});

lookZone.addEventListener('pointerup', e => {
  lookStartX = null;
});

// ============================================================================
// ANIMATION LOOP
// ============================================================================

function animate() {
  requestAnimationFrame(animate);
  
  const dt = 1 / 60; // Assume 60 FPS
  
  // Handle joystick input
  if (joystickActive && Math.hypot(joystickX, joystickY) > 0.1) {
    const moveAngle = Math.atan2(joystickX, -joystickY);
    const worldAngle = player.angle + moveAngle;
    const moveDir = Math.hypot(joystickX, joystickY);
    
    const nextX = player.x + Math.sin(worldAngle) * MOVE_SPEED * moveDir * dt;
    const nextZ = player.z + Math.cos(worldAngle) * MOVE_SPEED * moveDir * dt;
    
    // Collision check with axis separation
    if (canMoveTo(nextX, player.y, player.z)) {
      player.x = nextX;
    }
    if (canMoveTo(player.x, player.y, nextZ)) {
      player.z = nextZ;
    }
  }
  
  // Update camera from player
  camera.position.set(player.x, player.y, player.z);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.angle;
  camera.rotation.x = 0;
  
  // Render
  renderer.render(scene, camera);
}

animate();

// ============================================================================
// PWA
// ============================================================================

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {
    // Service worker registration failed, app still works offline after first load
  });
}
</script>
</body>
</html>
