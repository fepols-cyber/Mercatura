<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#161616">
<link rel="manifest" href="manifest.webmanifest">
<title>MERCATURA v0.2</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,-apple-system,sans-serif}
#game{width:100%;height:100%;display:block;touch-action:none;background:#111}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:100}
.pill{background:#111d;padding:8px 12px;border:1px solid #ffffff33;border-radius:12px;backdrop-filter:blur(8px);pointer-events:auto}
#msg{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:#111d;padding:8px 12px;border-radius:10px;opacity:0;transition:.2s;z-index:100}
#controls{position:fixed;inset:0;pointer-events:none}
#joystick-left{position:fixed;bottom:20px;left:20px;width:120px;height:120px;border-radius:50%;background:#ffffff11;border:1px solid #ffffff33;pointer-events:auto;z-index:50}
#joystick-left::before{content:'';position:absolute;inset:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:#ffffff44;pointer-events:none}
#look-zone{position:fixed;right:0;top:0;width:40%;height:100%;pointer-events:auto;touch-action:none;z-index:40}
.interact-btn{position:fixed;bottom:20px;right:20px;width:80px;height:80px;border-radius:50%;background:#d87922dd;border:1px solid #ffffff44;color:#fff;font-size:24px;cursor:pointer;pointer-events:auto;z-index:50;display:flex;align-items:center;justify-content:center}
.shop-btn{position:fixed;bottom:110px;right:20px;width:70px;height:70px;border-radius:50%;background:#4d7aaddd;border:1px solid #ffffff44;color:#fff;font-size:18px;cursor:pointer;pointer-events:auto;z-index:50;display:flex;align-items:center;justify-content:center}
#panel{position:fixed;left:12px;right:12px;bottom:12px;background:#171717f2;border:1px solid #ffffff33;border-radius:16px;padding:14px;display:none;max-height:48%;overflow:auto;z-index:60}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff18}
button.action{background:#d87922;color:white;border:0;border-radius:9px;padding:9px 12px}
small{opacity:.72}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="pill"><b>MERCATURA</b><br><small>Tag <span id="day">1</span></small></div><div class="pill"><span id="money">250.00</span> €<br><small>Lager: <span id="stock">8</span> | Regal: <span id="shelf">6</span></small></div></div>
<div id="msg"></div>
<div id="controls">
  <div id="joystick-left"></div>
  <div id="look-zone"></div>
  <button class="interact-btn" id="interact">⚙</button>
  <button class="shop-btn" id="shop">📋</button>
</div>
<div id="panel"></div>
<script>
// ============================================================================
// MERCATURA v0.2 - Foundation Build
// Single-file PWA with enclosed supermarket interior, collision, mobile controls
// ============================================================================

// ============================================================================
// WORLD DEFINITION - Tile-based layout
// ============================================================================
// Legend: '#' = wall, '.' = floor, 'S' = shelf, 'R' = register, 'F' = fridge, 'E' = entrance, 'K' = stockroom
const WORLD = {
  width: 12,
  height: 14,
  tileSize: 1,
  map: [
    '############',
    '#..RRRR....#',
    '#..........#',
    '#.S......S.#',
    '#.S......S.#',
    '#..........#',
    '#.FFFF.....#',
    '#..........#',
    '#..........#',
    '#K.K...E...#',
    '#K.K.......#',
    '#..........#',
    '#..........#',
    '############'
  ]
};

// Fixture metadata: position, dimensions, label
const FIXTURES = [
  {x: 1.5, z: 1, w: 3, h: 0.8, col: '#3d4a50', label: 'KASSE', type: 'register'},
  {x: 1.5, z: 3.5, w: 0.5, h: 1.8, col: '#a87a42', label: 'REGAL', type: 'shelf'},
  {x: 1.5, z: 4.5, w: 0.5, h: 1.8, col: '#a87a42', label: 'REGAL', type: 'shelf'},
  {x: 9, z: 3.5, w: 0.5, h: 1.8, col: '#a87a42', label: 'REGAL', type: 'shelf'},
  {x: 9, z: 4.5, w: 0.5, h: 1.8, col: '#a87a42', label: 'REGAL', type: 'shelf'},
  {x: 1.5, z: 6.5, w: 4, h: 0.8, col: '#4a7a99', label: 'KÜHLUNG', type: 'fridge'},
  {x: 5.5, z: 9, w: 2, h: 0.8, col: '#6b6b6b', label: 'EINGANG', type: 'entrance'},
  {x: 1, z: 9.5, w: 0.8, h: 1.2, col: '#5a5a5a', label: 'LAGER', type: 'stockroom'}
];

// Collision bounds
function getTileType(x, z) {
  const tx = Math.floor(x);
  const tz = Math.floor(z);
  if (tz < 0 || tz >= WORLD.height || tx < 0 || tx >= WORLD.width) return '#';
  return WORLD.map[tz][tx];
}

function canWalkAt(x, z, radius = 0.3) {
  const t = getTileType(x, z);
  if (t === '#') return false;
  
  for (let f of FIXTURES) {
    const dx = Math.abs(x - f.x);
    const dy = Math.abs(z - f.z);
    if (dx < f.w / 2 + radius && dy < f.h / 2 + radius) return false;
  }
  return true;
}

// ============================================================================
// GAME STATE
// ============================================================================
let S = JSON.parse(localStorage.getItem('mercaturaSave') || 'null') || {
  money: 250,
  stock: 8,
  shelf: 6,
  price: 3.2,
  day: 1,
  sales: 0,
  exp: 0
};

let p = {x: 5.5, y: 1.65, z: 11, a: Math.PI};
let customers = [];
let spawn = 0;
let interactionCooldown = 0;

let joystickActive = false;
let joystickX = 0, joystickY = 0;
let lookStartX = null;

const save = () => localStorage.setItem('mercaturaSave', JSON.stringify(S));

function msg(t) {
  let m = document.getElementById('msg');
  m.textContent = t;
  m.style.opacity = 1;
  setTimeout(() => m.style.opacity = 0, 1600);
}

function hud() {
  document.getElementById('money').textContent = S.money.toFixed(2);
  document.getElementById('stock').textContent = S.stock;
  document.getElementById('shelf').textContent = S.shelf;
  document.getElementById('day').textContent = S.day;
}
hud();

// ============================================================================
// CANVAS & RENDERING
// ============================================================================
const c = document.getElementById('game'), x = c.getContext('2d');
let W, H;

function resize() {
  W = c.width = innerWidth * devicePixelRatio;
  H = c.height = innerHeight * devicePixelRatio;
  x.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
addEventListener('resize', resize);
resize();

function project(wx, wz) {
  const dx = wx - p.x;
  const dz = wz - p.z;
  const ca = Math.cos(-p.a);
  const sa = Math.sin(-p.a);
  const rx = dx * ca - dz * sa;
  const rz = dx * sa + dz * ca;
  if (rz < 0.2) return null;
  const f = Math.min(innerWidth, innerHeight) * 0.9;
  return [
    innerWidth / 2 + (rx / rz) * f,
    innerHeight / 2 + (0.5 / rz) * f,
    rz
  ];
}

function rect3(wx, wz, ww, hh, col, label) {
  const q = project(wx, wz);
  if (!q) return;
  const [sx, sy, z] = q;
  const sc = Math.min(260, 180 / z);
  x.fillStyle = col;
  x.fillRect(sx - ww * sc / 2, sy - hh * sc, ww * sc, hh * sc);
  x.strokeStyle = '#0008';
  x.lineWidth = 1;
  x.strokeRect(sx - ww * sc / 2, sy - hh * sc, ww * sc, hh * sc);
  if (label) {
    x.fillStyle = '#fff';
    x.font = Math.max(8, Math.min(16, 12 / z)) + 'px system-ui';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText(label, sx, sy - hh * sc / 2);
  }
}

function drawWalls() {
  x.strokeStyle = '#ffffff22';
  x.lineWidth = 2;
  
  const scanRes = 30;
  for (let i = 0; i < scanRes; i++) {
    const angle = p.a - Math.PI / 3 + (i / scanRes) * (2 * Math.PI / 3);
    const rayDx = Math.cos(angle);
    const rayDz = Math.sin(angle);
    
    for (let dist = 0.1; dist < 20; dist += 0.1) {
      const rx = p.x + rayDx * dist;
      const rz = p.z + rayDz * dist;
      if (getTileType(rx, rz) === '#') {
        const q = project(rx, rz);
        if (q) {
          const [sx, sy, z] = q;
          const wallHeight = (innerHeight / 2) / z;
          x.beginPath();
          x.moveTo(sx, sy - wallHeight);
          x.lineTo(sx, sy + wallHeight);
          x.stroke();
        }
        break;
      }
    }
  }
}

function drawFloor() {
  x.fillStyle = '#663322';
  x.fillRect(0, innerHeight / 2, innerWidth, innerHeight / 2);
  
  x.strokeStyle = '#ffffff18';
  x.lineWidth = 1;
  const gridSpacing = 2;
  
  for (let gx = Math.floor(p.x) - 10; gx <= Math.floor(p.x) + 10; gx += gridSpacing) {
    const a = project(gx, p.z - 10);
    const b = project(gx, p.z + 10);
    if (a && b) {
      x.beginPath();
      x.moveTo(a[0], a[1]);
      x.lineTo(b[0], b[1]);
      x.stroke();
    }
  }
  
  for (let gz = Math.floor(p.z) - 10; gz <= Math.floor(p.z) + 10; gz += gridSpacing) {
    const a = project(p.x - 10, gz);
    const b = project(p.x + 10, gz);
    if (a && b) {
      x.beginPath();
      x.moveTo(a[0], a[1]);
      x.lineTo(b[0], b[1]);
      x.stroke();
    }
  }
}

function drawCeiling() {
  const g = x.createLinearGradient(0, 0, 0, innerHeight / 2);
  g.addColorStop(0, '#8aa0ad');
  g.addColorStop(1, '#d7d2c7');
  x.fillStyle = g;
  x.fillRect(0, 0, innerWidth, innerHeight / 2);
}

function draw() {
  x.clearRect(0, 0, innerWidth, innerHeight);
  
  drawCeiling();
  drawFloor();
  drawWalls();
  
  FIXTURES.forEach(f => {
    rect3(f.x, f.z, f.w, f.h, f.col, f.label);
  });
  
  customers.forEach(o => {
    rect3(o.x, o.z, 0.45, 1.65, o.col, '');
  });
  
  x.fillStyle = '#ffffff99';
  x.fillRect(innerWidth / 2 - 1, innerHeight / 2 - 8, 2, 16);
  x.fillRect(innerWidth / 2 - 8, innerHeight / 2 - 1, 16, 2);
  
  if (joystickActive) {
    const jx = joystickX * 40;
    const jy = joystickY * 40;
    x.fillStyle = '#ffffff44';
    x.beginPath();
    x.arc(60 + jx, innerHeight - 60 + jy, 15, 0, Math.PI * 2);
    x.fill();
  }
}

// ============================================================================
// MOVEMENT & INTERACTION
// ============================================================================
function near(ax, az, d = 1.8) {
  return Math.hypot(p.x - ax, p.z - az) < d;
}

function interact() {
  if (interactionCooldown > 0) return;
  interactionCooldown = 0.3;
  
  if (near(1.5, 1) && S.stock > 0) {
    let n = Math.min(6 - S.shelf, S.stock);
    if (n > 0) {
      S.stock -= n;
      S.shelf += n;
      msg(n + ' Produkte eingeräumt');
      save();
      hud();
    } else {
      msg('Regal ist voll');
    }
  } else if (near(1.5, 1)) {
    if (S.sales > 0) {
      msg('Kasse: ' + S.sales + ' Verkäufe heute');
    } else {
      msg('Noch keine Verkäufe');
    }
  } else if (near(5.5, 9)) {
    S.day++;
    S.sales = 0;
    msg('Neuer Verkaufstag');
    save();
    hud();
  } else {
    msg('Hier gibt es gerade nichts zu tun');
  }
}

document.getElementById('interact').addEventListener('click', interact);

// ============================================================================
// MANAGEMENT PANEL
// ============================================================================
function renderPanel() {
  const panel = document.getElementById('panel');
  panel.innerHTML = `<b>Marktverwaltung</b>
<div class="row"><span>Ware bestellen<br><small>10 Stück · 15,00 €</small></span><button class="action" onclick="order()">Bestellen</button></div>
<div class="row"><span>Verkaufspreis<br><small>Aktuell ${S.price.toFixed(2)} €</small></span><span><button class="action" onclick="price(-.2)">−</button> <button class="action" onclick="price(.2)">+</button></span></div>
<div class="row"><span>Lagerbestand<br><small>${S.stock} Einheiten</small></span></div>
<div class="row"><span>Regalbestand<br><small>${S.shelf} Einheiten</small></span></div>
<small>v0.2 Foundation: Mobiler Steuerung, Raumbasiert, Kollision. Bewegung mit Joystick, Umsehen mit Wischen.</small>`;
}

document.getElementById('shop').addEventListener('click', () => {
  const panel = document.getElementById('panel');
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
  if (panel.style.display === 'block') renderPanel();
});

window.order = () => {
  if (S.money >= 15) {
    S.money -= 15;
    S.stock += 10;
    save();
    hud();
    renderPanel();
    msg('Lieferung angekommen');
  } else {
    msg('Zu wenig Geld');
  }
};

window.price = d => {
  S.price = Math.max(0.5, Math.min(8, S.price + d));
  save();
  renderPanel();
};

// ============================================================================
// MOBILE CONTROLS - Virtual Joystick & Look
// ============================================================================
const joystickArea = document.getElementById('joystick-left');
const lookZone = document.getElementById('look-zone');

joystickArea.addEventListener('pointerdown', e => {
  e.preventDefault();
  joystickActive = true;
  joystickArea.setPointerCapture?.(e.pointerId);
  updateJoystick(e);
});

joystickArea.addEventListener('pointermove', e => {
  if (joystickActive) updateJoystick(e);
});

joystickArea.addEventListener('pointerup', e => {
  joystickActive = false;
  joystickX = joystickY = 0;
});

function updateJoystick(e) {
  const rect = joystickArea.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const dx = e.clientX - cx;
  const dy = e.clientY - cy;
  const dist = Math.hypot(dx, dy);
  const maxDist = 50;
  
  if (dist > maxDist) {
    joystickX = (dx / dist) * maxDist / maxDist;
    joystickY = (dy / dist) * maxDist / maxDist;
  } else {
    joystickX = dx / maxDist;
    joystickY = dy / maxDist;
  }
}

lookZone.addEventListener('pointerdown', e => {
  e.preventDefault();
  lookStartX = e.clientX;
  lookZone.setPointerCapture?.(e.pointerId);
});

lookZone.addEventListener('pointermove', e => {
  if (lookStartX !== null) {
    const deltaX = (e.clientX - lookStartX) * 0.005;
    p.a += deltaX;
    lookStartX = e.clientX;
  }
});

lookZone.addEventListener('pointerup', e => {
  lookStartX = null;
});

// ============================================================================
// CUSTOMER AI
// ============================================================================
function updateCustomers(dt) {
  spawn -= dt;
  if (spawn < 0) {
    spawn = 3 + Math.random() * 4;
    if (customers.length < 5) {
      customers.push({
        x: 5.5 + (Math.random() * 0.5 - 0.25),
        z: 9,
        col: ['#875', '#587', '#758', '#786'][Math.floor(Math.random() * 4)],
        life: 0
      });
    }
  }
  
  customers.forEach((o, idx) => {
    o.life += dt;
    o.z -= dt * 0.65;
    
    if (o.z < 3 && S.shelf > 0 && Math.random() < dt * 0.5) {
      S.shelf--;
      S.money += S.price;
      S.sales++;
      save();
      hud();
      o.z = -5;
    }
    
    if (o.z < -7) {
      customers.splice(idx, 1);
    }
  });
}

// ============================================================================
// MAIN LOOP
// ============================================================================
function tick(t) {
  const dt = 0.016;
  const sp = 2.2 * dt;
  
  interactionCooldown -= dt;
  
  if (joystickActive) {
    const moveDir = Math.hypot(joystickX, joystickY);
    if (moveDir > 0.1) {
      const moveAngle = Math.atan2(joystickX, -joystickY);
      const worldAngle = p.a + moveAngle;
      const dx = Math.sin(worldAngle) * sp * moveDir;
      const dz = Math.cos(worldAngle) * sp * moveDir;
      
      if (canWalkAt(p.x + dx, p.z, 0.3)) p.x += dx;
      if (canWalkAt(p.x, p.z + dz, 0.3)) p.z += dz;
    }
  }
  
  updateCustomers(dt);
  
  draw();
  
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ============================================================================
// PWA INITIALIZATION
// ============================================================================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
</html>
